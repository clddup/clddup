name: Generate contribution breakout

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: contribution-breakout
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate light and dark SVGs
        uses: clddup/contribution-breakout@47e4427f141debff3dc1f81285bcec0619f3dd01 # v0.1.0

      - name: Publish animations to the breakout-output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: breakout-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
